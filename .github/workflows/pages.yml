name: Deploy frontend to GitHub Pages

# Publishes the web application (client/) to GitHub Pages on every push to main.
# The backend for this edition is the Google Apps Script Web App whose URL is set
# in client/public/config.json (see README → "Running on GitHub Pages + Google Apps Script").

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install client dependencies
        run: npm --prefix client ci
      - name: Build client for GitHub Pages
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm --prefix client run build
          cp client/dist/index.html client/dist/404.html
          touch client/dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
